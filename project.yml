# Definición del proyecto Xcode. No hay Mac: el .xcodeproj lo genera XcodeGen
# en la máquina de compilación (GitHub Actions / Codemagic). No se versiona.
name: Lapsus
options:
  bundleIdPrefix: com.edgardorocha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LP_BUILD_DATE: "local"

targets:
  Lapsus:
    type: application
    platform: iOS
    sources:
      - path: Lapsus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgardorocha.lapsus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: Lapsus/Info.plist
      properties:
        CFBundleDisplayName: Lapsus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LPBuildDate: $(LP_BUILD_DATE)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    scheme:
      gatherCoverageData: false
