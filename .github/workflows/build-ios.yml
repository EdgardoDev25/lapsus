name: Compilar iOS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'diseno/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compilar IPA sin firmar
        run: bash scripts/build-ipa.sh "${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Lapsus-build-${{ github.run_number }}
          path: build/Lapsus.ipa
          retention-days: 14
